name: backend-build-push-deploy

on:
  push:
    branches: [ "dev" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write   # (미사용이어도 무해)
  contents: read

env:
  LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}   # ex) yeahyakacr.azurecr.io

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable
        working-directory: backend
        run: chmod +x gradlew

      - name: Build jar (Gradle)
        working-directory: backend
        run: ./gradlew clean bootJar -x test

      - name: Compute IMAGE_TAG
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "image_tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "image_tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      # --- 로그인 디버그 (도메인/캐시 정리) ---
      - name: Debug registry & logout
        run: |
          echo "LOGIN_SERVER='${{ env.LOGIN_SERVER }}'"
          docker logout "${{ env.LOGIN_SERVER }}" || true

      # --- ACR 로그인 (admin 계정) ---
      - name: Login to ACR (admin account)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.LOGIN_SERVER }}            # ex) yeahyakacr.azurecr.io (https:// 금지)
          username: ${{ secrets.ACR_USERNAME }}        # 포털 Access Keys의 '사용자 이름'
          password: ${{ secrets.ACR_PASSWORD }}        # Access Keys의 password2(회전 권장)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push to ACR
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.LOGIN_SERVER }}/backend:${{ steps.meta.outputs.image_tag }}
            ${{ env.LOGIN_SERVER }}/backend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - name: SSH into VM & update container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            LOGIN_SERVER="${{ env.LOGIN_SERVER }}"
            IMAGE="${LOGIN_SERVER}/backend:latest"

            # 레지스트리 로그인 (admin 계정)
            echo "${{ secrets.ACR_PASSWORD }}" | docker login "$LOGIN_SERVER" -u "${{ secrets.ACR_USERNAME }}" --password-stdin

            docker pull "$IMAGE"

            docker rm -f backend || true
            docker run -d --name backend \
              -p 8080:8080 \
              --restart unless-stopped \
              -e SPRING_PROFILES_ACTIVE=prod \
              "$IMAGE"

            docker image prune -f
